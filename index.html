<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>群聊情报台</title>
  <link rel="stylesheet" href="styles.css">
  <style>.ask-shell{background:#fff;border:1px solid #e4e7ec;min-height:620px}.ask-form{padding:22px;border-bottom:1px solid #e4e7ec}.ask-form label{display:block;font-weight:700;margin-bottom:8px}.ask-form div{display:flex;gap:8px}.ask-form input{border:1px solid #e4e7ec;padding:11px 12px}.ask-form button{border:0;background:#1667d9;color:#fff;padding:10px 22px;cursor:pointer}.ask-form button:disabled{opacity:.6}.answer{padding:28px 32px}.answer .markdown{max-width:900px}@media(max-width:820px){.answer{padding:21px 17px}.ask-form div{display:block}.ask-form button{width:100%;margin-top:8px}}</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark">Q</span><div><strong>群聊情报台</strong><small>每小时自动归档</small></div></div>
    <nav class="tabs" aria-label="内容视图">
      <button class="tab active" data-view="reports">小时简报</button>
      <button class="tab" data-view="resources">专题资源</button>
      <button class="tab" data-view="products">商品排行</button>
      <button class="tab" data-view="ask">问资料库</button>
    </nav>
    <div id="connection" class="connection">检查连接中</div>
  </header>
  <main class="page">
    <section class="summary-bar">
      <div><p class="kicker" id="view-kicker">LATEST BRIEFING</p><h1 id="view-title">最近一小时发生了什么</h1></div>
      <div class="counts"><span id="report-count">0 份简报</span><span id="resource-count">0 项资源</span><span id="product-count">0 个商品</span></div>
    </section>
    <section class="toolbar">
      <label class="search"><span aria-hidden="true">⌕</span><input id="search" placeholder="搜索简报、资源、商品或卖家"></label>
      <select id="filter"><option value="">全部</option></select>
      <button id="refresh" class="icon-button" type="button" title="刷新" aria-label="刷新">↻</button>
    </section>

    <section id="reports-view" class="view active">
      <div class="workspace"><aside class="sidebar"><div class="side-head"><h2>小时归档</h2><span id="visible-count">0</span></div><div id="report-list" class="list"><div class="empty">等待整点简报</div></div></aside><article class="reader"><div id="reader-head" class="reader-head"></div><div id="reader-body" class="reader-body"><div class="empty large">每小时整点自动生成。</div></div></article></div>
    </section>

    <section id="resources-view" class="view">
      <div class="workspace"><aside class="sidebar"><div class="side-head"><h2>专题</h2><span id="topic-count">0</span></div><div id="topic-list" class="list"></div></aside><article class="reader"><div id="topic-head" class="reader-head"></div><div id="resource-list" class="reader-body"></div></article></div>
    </section>

    <section id="products-view" class="view">
      <div id="product-groups" class="product-groups"><div class="empty large">尚未收集商品信息</div></div>
    </section>
    <section id="ask-view" class="view">
      <div class="ask-shell"><form id="ask-form" class="ask-form"><label for="question">向最近三天资料提问</label><div><input id="question" placeholder="例如：K12 成品号最低多少钱，在哪个群找谁？"><button type="submit">查询</button></div></form><article id="answer" class="answer"><div class="empty large">输入要找的商品、服务、渠道或资源。</div></article></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
